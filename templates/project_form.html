{% extends 'base.html' %}
{% block title %}{{ heading }} | Supervisor Finder{% endblock %}
{% block content %}
<section class="container form-page"><a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a><p class="eyebrow">Project ideas</p><h1>{{ heading }}</h1><p class="lead">Be specific enough for students to decide whether they would like to discuss the idea.</p><form class="form-card" method="post"><label for="title">Project title</label><input id="title" name="title" value="{{ project.get('title', '') }}" required minlength="5" maxlength="120" placeholder="e.g. Analysing technical debt in open-source projects"><label for="summary">Project summary</label><textarea id="summary" name="summary" required minlength="40" maxlength="1500" rows="8" placeholder="Explain the problem, possible approach and expected outcome.">{{ project.get('summary', '') }}</textarea><label for="skills">Suggested skills</label><input id="skills" name="skills" value="{{ project.get('skills', '') }}" required minlength="2" maxlength="200" placeholder="e.g. Python, SQL, data visualisation"><div class="form-grid"><div><label for="project_type">Project type</label><select id="project_type" name="project_type" required><option value="">Choose one</option>{% for option in ['Research','Development','Data analysis','Literature review'] %}<option value="{{ option }}" {% if project.get('project_type') == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></div><div><label for="availability">Availability</label><select id="availability" name="availability" required>{% for option in ['Available','Limited availability','Allocated'] %}<option value="{{ option }}" {% if project.get('availability') == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></div></div><div class="form-actions"><a href="{{ url_for('dashboard') }}">Cancel</a><button class="button" type="submit">{{ submit_label }}</button></div></form></section>
{% endblock %}
